<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:transparent;
  font-family:Arial,sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

/* ═══════════════════════════════
   IPOD
═══════════════════════════════ */

#ipod{
  width:235px;
  max-width:100%;
  height:310px;

  padding:14px;

  border:1px solid #c9c9c9;
  border-radius:30px;

  background:
    linear-gradient(
      145deg,
      #fafafa 0%,
      #e7e7e7 38%,
      #f7f7f7 62%,
      #d5d5d5 100%
    );

  box-shadow:
    inset 0 1px 3px rgba(255,255,255,.95),
    inset 0 -2px 5px rgba(120,120,120,.12),
    0 7px 15px rgba(0,0,0,.14);
}

/* ═══════════════════════════════
   PANTALLA
═══════════════════════════════ */

#screen{
  position:relative;

  width:100%;
  height:120px;

  overflow:hidden;

  border:5px solid #161616;
  border-radius:10px;

  background:#9d9694;
}

/* fondo desenfocado */

#screen-bg{
  position:absolute;
  inset:-20px;

  background-position:center;
  background-size:cover;

  filter:blur(16px);
  transform:scale(1.2);

  opacity:.55;
}

/* capa oscura */

#screen-shade{
  position:absolute;
  inset:0;

  background:rgba(40,35,38,.20);
}

/* contenido */

#screen-content{
  position:relative;
  z-index:2;

  display:flex;
  gap:12px;

  padding:10px;
}

/* portada */

#cover{
  width:76px;
  height:76px;

  flex:0 0 76px;

  object-fit:cover;

  border-radius:5px;

  box-shadow:0 2px 6px rgba(0,0,0,.28);
}

/* información */

#info{
  min-width:0;
  flex:1;

  padding-top:9px;

  color:white;

  text-shadow:0 1px 2px rgba(0,0,0,.25);
}

#title{
  font-size:14px;
  font-weight:bold;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#artist{
  margin-top:10px;

  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* ═══════════════════════════════
   BARRA DE PROGRESO
═══════════════════════════════ */

#progress-row{
  position:absolute;

  z-index:4;

  left:10px;
  right:10px;
  bottom:8px;

  display:flex;
  align-items:center;

  gap:6px;

  color:white;

  font-family:"Courier New",monospace;
  font-size:9px;
}

#progress-track{
  flex:1;

  height:7px;

  overflow:hidden;

  border-radius:10px;

  background:rgba(50,45,45,.35);

  cursor:pointer;
}

#progress-bar{
  width:0%;
  height:100%;

  border-radius:10px;

  background:rgba(255,255,255,.9);
}

/* ═══════════════════════════════
   RUEDA
═══════════════════════════════ */

#wheel{
  position:relative;

  width:140px;
  height:140px;

  margin:18px auto 0;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #eeeeee
    );

  border:1px solid #c8c8c8;

  box-shadow:
    inset 0 1px 3px rgba(255,255,255,1),
    0 2px 4px rgba(0,0,0,.12);
}

/* círculo central */

#center{
  position:absolute;

  left:50%;
  top:50%;

  width:55px;
  height:5555px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #eeeeee,
      #dadada
    );

  border:1px solid #c5c5c5;
}

/* ═══════════════════════════════
   BOTONES
═══════════════════════════════ */

button{
  -webkit-appearance:none;
  appearance:none;
}

.wheel-button{
  position:absolute;

  margin:0;
  padding:0;

  border:0;
  outline:0;

  background:transparent;

  color:#a5a8ac;

  cursor:pointer;

  font-family:Arial,sans-serif;
}

/* MUSIC */

#menu{
  top:14px;
  left:50%;

  transform:translateX(-50%);

  font-size:13px;
  font-weight:bold;

  color:#a5a8ac;
}

/* ANTERIOR */

#prev{
  left:16px;
  top:50%;

  width:28px;
  height:28px;

  transform:translateY(-50%);
}

/* triángulo anterior */

#prev::before{
  content:"";

  position:absolute;

  left:4px;
  top:50%;

  transform:translateY(-50%);

  width:0;
  height:0;

  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-right:11px solid #a5a8ac;
}

/* rayita anterior */

#prev::after{
  content:"";

  position:absolute;

  left:2px;
  top:50%;

  width:4px;
  height:16px;

  transform:translateY(-50%);

  background:#a5a8ac;

  border-radius:1px;
}

/* SIGUIENTE */

#next{
  right:16px;
  top:50%;

  width:28px;
  height:28px;

  transform:translateY(-50%);
}

/* triángulo siguiente */

#next::before{
  content:"";

  position:absolute;

  right:4px;
  top:50%;

  transform:translateY(-50%);

  width:0;
  height:0;

  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-left:11px solid #a5a8ac;
}

/* rayita siguiente */

#next::after{
  content:"";

  position:absolute;

  right:2px;
  top:50%;

  width:4px;
  height:16px;

  transform:translateY(-50%);

  background:#a5a8ac;

  border-radius:1px;
}

/* ═══════════════════════════════
   PLAY / PAUSA
═══════════════════════════════ */

#play{
  left:50%;
  bottom:10px;

  width:34px;
  height:25px;

  transform:translateX(-50%);
}

/* TRIÁNGULO PLAY */

#play .play-icon{
  position:absolute;

  left:50%;
  top:50%;

  width:0;
  height:0;

  transform:translate(-42%,-50%);

  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-left:12px solid #a5a8ac;
}

/* PAUSA */

#play .pause-icon{
  display:none;

  position:absolute;

  left:50%;
  top:50%;

  width:14px;
  height:16px;

  transform:translate(-50%,-50%);
}

#play .pause-icon::before,
#play .pause-icon::after{
  content:"";

  position:absolute;

  top:0;

  width:4px;
  height:16px;

  border-radius:1px;

  background:#a5a8ac;
}

#play .pause-icon::before{
  left:1px;
}

#play .pause-icon::after{
  right:1px;
}

/* CUANDO ESTÁ REPRODUCIENDO */

#play.playing .play-icon{
  display:none;
}

#play.playing .pause-icon{
  display:block;
}

/* ═══════════════════════════════
   PLAYLIST
═══════════════════════════════ */

#playlist{
  display:none;

  width:260px;

  max-height:160px;

  margin:8px auto;

  padding:6px;

  overflow-y:auto;

  border:1px solid #ead1dc;
  border-radius:10px;

  background:#fff9fc;

  font-family:"Courier New",monospace;
}

#playlist.open{
  display:block;
}

.song{
  display:block;

  width:100%;

  padding:7px;

  border:0;
  border-radius:6px;

  background:transparent;

  color:#8c737d;

  text-align:left;

  font-family:inherit;
  font-size:9px;

  cursor:pointer;
}

.song:hover,
.song.current{
  background:#ffe8f0;
  color:#bc7892;
}

</style>
</head>

<body>

<div>

<div id="ipod">

  <!-- PANTALLA -->

  <div id="screen">

    <div id="screen-bg"></div>

    <div id="screen-shade"></div>

    <div id="screen-content">

      <img id="cover" alt="Portada">

      <div id="info">

        <div id="title">
          cargando...
        </div>

        <div id="artist">
          ♡
        </div>

      </div>

    </div>

    <!-- PROGRESO -->

    <div id="progress-row">

      <span id="current-time">
        0:00
      </span>

      <div id="progress-track">

        <div id="progress-bar"></div>

      </div>

      <span id="duration">
        0:00
      </span>

    </div>

  </div>


  <!-- RUEDA -->

  <div id="wheel">

    <button
      id="menu"
      class="wheel-button"
      type="button">
      MUSIC
    </button>


    <button
      id="prev"
      class="wheel-button"
      type="button"
      aria-label="Canción anterior">
    </button>


    <div id="center"></div>


    <button
      id="next"
      class="wheel-button"
      type="button"
      aria-label="Canción siguiente">
    </button>


    <button
      id="play"
      class="wheel-button"
      type="button"
      aria-label="Reproducir o pausar">

      <span class="play-icon"></span>

      <span class="pause-icon"></span>

    </button>

  </div>

</div>


<div id="playlist"></div>

<audio
  id="audio"
  preload="metadata">
</audio>

</div>


<script>

(function(){

const BASE =
"https://camiandreafuentealba-dev.github.io/lazy-days-music/";

const PLAYLIST =
BASE + "playlist.json";


const audio =
document.getElementById("audio");

const cover =
document.getElementById("cover");

const screenBg =
document.getElementById("screen-bg");

const title =
document.getElementById("title");

const artist =
document.getElementById("artist");

const play =
document.getElementById("play");

const prev =
document.getElementById("prev");

const next =
document.getElementById("next");

const menu =
document.getElementById("menu");

const progressTrack =
document.getElementById("progress-track");

const progressBar =
document.getElementById("progress-bar");

const currentTime =
document.getElementById("current-time");

const duration =
document.getElementById("duration");

const playlist =
document.getElementById("playlist");


let songs = [];
let current = 0;


/* ═══════════════════════════════
   CODIFICAR RUTAS
═══════════════════════════════ */

function encodePath(path){

  return path
    .split("/")
    .map(function(part){
      return encodeURIComponent(part);
    })
    .join("/");

}


/* ═══════════════════════════════
   TIEMPO
═══════════════════════════════ */

function formatTime(seconds){

  if(!isFinite(seconds)){
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2,"0");

  return minutes + ":" + secs;

}


/* ═══════════════════════════════
   CARGAR CANCIÓN
═══════════════════════════════ */

function loadSong(index){

  if(!songs.length){
    return;
  }

  if(index < 0){
    index = songs.length - 1;
  }

  if(index >= songs.length){
    index = 0;
  }

  current = index;

  const song =
    songs[current];

  const audioURL =
    BASE + encodePath(song.audio);

  const coverURL =
    BASE + encodePath(song.portada);


  title.textContent =
    song.titulo;

  artist.textContent =
    song.artista;

  cover.src =
    coverURL;

  screenBg.style.backgroundImage =
    'url("' + coverURL + '")';

  audio.src =
    audioURL;

  progressBar.style.width =
    "0%";

  currentTime.textContent =
    "0:00";

  duration.textContent =
    "0:00";

  play.classList.remove("playing");

  updatePlaylist();

}


/* ═══════════════════════════════
   REPRODUCIR
═══════════════════════════════ */

function startPlaying(){

  audio.play()
    .then(function(){

      play.classList.add("playing");

    })
    .catch(function(error){

      console.log(error);

    });

}


/* ═══════════════════════════════
   SIGUIENTE
═══════════════════════════════ */

function nextSong(){

  loadSong(current + 1);

  startPlaying();

}


/* ═══════════════════════════════
   ANTERIOR
═══════════════════════════════ */

function previousSong(){

  loadSong(current - 1);

  startPlaying();

}


/* ═══════════════════════════════
   PLAY / PAUSA
═══════════════════════════════ */

play.addEventListener(
"click",
function(){

  if(audio.paused){

    startPlaying();

  }else{

    audio.pause();

  }

});


/* botones */

prev.addEventListener(
"click",
previousSong
);

next.addEventListener(
"click",
nextSong
);


/* playlist */

menu.addEventListener(
"click",
function(){

  playlist.classList.toggle("open");

});


/* ═══════════════════════════════
   ESTADO PLAY
═══════════════════════════════ */

audio.addEventListener(
"play",
function(){

  play.classList.add("playing");

});


/* ═══════════════════════════════
   ESTADO PAUSA
═══════════════════════════════ */

audio.addEventListener(
"pause",
function(){

  play.classList.remove("playing");

});


/* siguiente automática */

audio.addEventListener(
"ended",
nextSong
);


/* duración */

audio.addEventListener(
"loadedmetadata",
function(){

  duration.textContent =
    formatTime(audio.duration);

});


/* progreso */

audio.addEventListener(
"timeupdate",
function(){

  if(!audio.duration){
    return;
  }

  const percentage =
    (
      audio.currentTime /
      audio.duration
    ) * 100;

  progressBar.style.width =
    percentage + "%";

  currentTime.textContent =
    formatTime(audio.currentTime);

  duration.textContent =
    formatTime(audio.duration);

});


/* mover progreso */

progressTrack.addEventListener(
"click",
function(event){

  if(!audio.duration){
    return;
  }

  const rect =
    progressTrack.getBoundingClientRect();

  const position =
    event.clientX - rect.left;

  const percentage =
    position / rect.width;

  audio.currentTime =
    percentage * audio.duration;

});


/* ═══════════════════════════════
   CREAR PLAYLIST
═══════════════════════════════ */

function createPlaylist(){

  playlist.innerHTML = "";

  songs.forEach(
  function(song,index){

    const button =
      document.createElement("button");

    button.type =
      "button";

    button.className =
      "song";

    button.textContent =
      "♡ " +
      song.titulo +
      " — " +
      song.artista;

    button.addEventListener(
    "click",
    function(){

      loadSong(index);

      startPlaying();

      playlist.classList.remove("open");

    });

    playlist.appendChild(button);

  });

}


/* canción seleccionada */

function updatePlaylist(){

  const options =
    playlist.querySelectorAll(".song");

  options.forEach(
  function(option,index){

    option.classList.toggle(
      "current",
      index === current
    );

  });

}


/* ═══════════════════════════════
   CARGAR PLAYLIST.JSON
═══════════════════════════════ */

fetch(PLAYLIST)

.then(function(response){

  if(!response.ok){

    throw new Error(
      "No se pudo cargar playlist.json"
    );

  }

  return response.json();

})

.then(function(data){

  songs = data;

  createPlaylist();

  loadSong(0);

})

.catch(function(error){

  title.textContent =
    "playlist error";

  artist.textContent =
    "♡";

  console.error(error);

});

})();

</script>

</body>
</html>
