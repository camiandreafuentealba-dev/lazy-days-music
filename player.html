<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:transparent;
}

body{
  font-family:Arial,sans-serif;
}


/* ══════════════════════════════
   IPOD
══════════════════════════════ */

#ipod{
  width:245px;
  margin:0 auto;
  padding:13px 12px 17px;

  border:1px solid #c8c8c8;
  border-radius:27px;

  background:
    linear-gradient(
      145deg,
      #fafafa 0%,
      #dedede 35%,
      #f6f6f6 65%,
      #d2d2d2 100%
    );

  box-shadow:
    inset 0 1px 3px rgba(255,255,255,.95),
    inset 0 -2px 5px rgba(100,100,100,.12),
    0 5px 12px rgba(0,0,0,.14);
}


/* ══════════════════════════════
   PANTALLA
══════════════════════════════ */

#screen{
  position:relative;
  width:100%;
  height:108px;
  overflow:hidden;

  border:5px solid #171717;
  border-radius:9px;

  background:#9f9698;

  box-shadow:
    inset 0 0 5px rgba(0,0,0,.35);
}

#screen-bg{
  position:absolute;
  inset:-15px;

  background-position:center;
  background-size:cover;

  filter:blur(14px);
  transform:scale(1.2);

  opacity:.55;
}

#screen-overlay{
  position:absolute;
  inset:0;

  background:rgba(35,28,31,.28);
}

#screen-main{
  position:relative;
  z-index:2;

  display:flex;
  gap:10px;

  height:100%;
  padding:9px;
}

#cover{
  width:64px;
  height:64px;
  flex:0 0 64px;

  object-fit:cover;

  border-radius:5px;

  box-shadow:
    0 2px 6px rgba(0,0,0,.32);
}

#info{
  min-width:0;
  flex:1;
  padding-top:9px;

  color:#fff;

  text-shadow:
    0 1px 2px rgba(0,0,0,.35);
}

#title{
  overflow:hidden;

  font-size:12px;
  font-weight:bold;

  white-space:nowrap;
  text-overflow:ellipsis;
}

#artist{
  margin-top:7px;
  overflow:hidden;

  font-size:10px;

  white-space:nowrap;
  text-overflow:ellipsis;
}


/* ══════════════════════════════
   PROGRESO
══════════════════════════════ */

#progress-row{
  position:absolute;
  z-index:5;

  left:9px;
  right:9px;
  bottom:7px;

  display:flex;
  align-items:center;
  gap:5px;

  color:#fff;

  font-family:"Courier New",monospace;
  font-size:8px;

  text-shadow:
    0 1px 2px rgba(0,0,0,.4);
}

#progress-track{
  flex:1;
  height:7px;

  overflow:hidden;

  border-radius:20px;

  background:rgba(30,25,27,.35);

  cursor:pointer;
}

#progress-bar{
  width:0%;
  height:100%;

  border-radius:20px;

  background:rgba(255,255,255,.92);
}


/* ══════════════════════════════
   RUEDA
══════════════════════════════ */

#wheel{
  position:relative;

  width:137px;
  height:137px;

  margin:15px auto 0;

  border:1px solid #c9c9c9;
  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #eeeeee
    );

  box-shadow:
    inset 0 1px 4px rgba(255,255,255,1),
    0 2px 4px rgba(0,0,0,.10);

  user-select:none;
}

#center{
  position:absolute;

  left:50%;
  top:50%;

  width:55px;
  height:55px;

  transform:translate(-50%,-50%);

  border:1px solid #c9c9c9;
  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #e9e9e9,
      #d9d9d9
    );

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.9);
}

.control{
  position:absolute;
  z-index:10;

  cursor:pointer;
  user-select:none;
}

#menu{
  top:13px;
  left:50%;

  transform:translateX(-50%);

  color:#9fa2a6;

  font-size:11px;
  font-weight:bold;
  letter-spacing:.5px;
}


/* ══════════════════════════════
   BOTONES DIBUJADOS CON CSS
══════════════════════════════ */

#previous{
  left:13px;
  top:50%;

  width:24px;
  height:22px;

  transform:translateY(-50%);
}

#next{
  right:13px;
  top:50%;

  width:24px;
  height:22px;

  transform:translateY(-50%);
}

#play{
  left:50%;
  bottom:10px;

  width:34px;
  height:23px;

  transform:translateX(-50%);
}


/* Anterior: barra + triángulo */

#previous::before{
  content:"";

  position:absolute;
  left:2px;
  top:5px;

  width:4px;
  height:12px;

  border-radius:1px;

  background:#9fa2a6;
}

#previous::after{
  content:"";

  position:absolute;
  left:5px;
  top:3px;

  width:0;
  height:0;

  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-right:11px solid #9fa2a6;
}


/* Siguiente: triángulo + barra */

#next::before{
  content:"";

  position:absolute;
  right:2px;
  top:5px;

  width:4px;
  height:12px;

  border-radius:1px;

  background:#9fa2a6;
}

#next::after{
  content:"";

  position:absolute;
  right:5px;
  top:3px;

  width:0;
  height:0;

  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-left:11px solid #9fa2a6;
}


/* Play */

#play .play-triangle{
  position:absolute;

  left:2px;
  top:3px;

  width:0;
  height:0;

  border-top:8px solid transparent;
  border-bottom:8px solid transparent;
  border-left:12px solid #9fa2a6;
}


/* Pausa */

#play .pause-bars{
  display:none;

  position:absolute;

  left:9px;
  top:3px;

  width:16px;
  height:16px;
}

#play .pause-bars::before,
#play .pause-bars::after{
  content:"";

  position:absolute;
  top:0;

  width:5px;
  height:16px;

  border-radius:1px;

  background:#9fa2a6;
}

#play .pause-bars::before{
  left:0;
}

#play .pause-bars::after{
  right:0;
}


/* Estado reproduciendo */

#play.playing .play-triangle{
  display:none;
}

#play.playing .pause-bars{
  display:block;
}


/* Efecto al presionar */

.control:active{
  opacity:.6;
}


/* ══════════════════════════════
   PLAYLIST
══════════════════════════════ */

#playlist{
  display:none;

  width:245px;
  max-height:95px;

  margin:7px auto 0;
  padding:5px;

  overflow-y:auto;

  background:#fff8fb;

  border:1px solid #eccfd9;
  border-radius:10px;

  font-family:"Courier New",monospace;
}

#playlist.open{
  display:block;
}

.song{
  padding:6px 7px;

  border-radius:6px;

  color:#8d737d;

  font-size:9px;

  cursor:pointer;
}

.song:hover,
.song.current{
  background:#ffe5ef;
  color:#bd7892;
}
</style>
</head>

<body>

<div id="ipod">

  <div id="screen">

    <div id="screen-bg"></div>
    <div id="screen-overlay"></div>

    <div id="screen-main">

      <img id="cover" alt="Portada">

      <div id="info">

        <div id="title">
          cargando...
        </div>

        <div id="artist">
          ♡
        </div>

      </div>

    </div>

    <div id="progress-row">

      <span id="current-time">
        0:00
      </span>

      <div id="progress-track">
        <div id="progress-bar"></div>
      </div>

      <span id="duration">
        0:00
      </span>

    </div>

  </div>


  <div id="wheel">

    <div
      id="menu"
      class="control">
      MUSIC
    </div>

    <div
      id="previous"
      class="control"
      title="Canción anterior">
    </div>

    <div id="center"></div>

    <div
      id="next"
      class="control"
      title="Canción siguiente">
    </div>

    <div
      id="play"
      class="control"
      title="Reproducir o pausar">

      <span class="play-triangle"></span>
      <span class="pause-bars"></span>

    </div>

  </div>

</div>


<div id="playlist"></div>


<audio
  id="audio"
  preload="metadata">
</audio>


<script>
(function(){

  const BASE =
    "https://camiandreafuentealba-dev.github.io/lazy-days-music/";

  const PLAYLIST_URL =
    BASE + "playlist.json";


  const audio =
    document.getElementById("audio");

  const cover =
    document.getElementById("cover");

  const background =
    document.getElementById("screen-bg");

  const title =
    document.getElementById("title");

  const artist =
    document.getElementById("artist");

  const play =
    document.getElementById("play");

  const previous =
    document.getElementById("previous");

  const next =
    document.getElementById("next");

  const menu =
    document.getElementById("menu");

  const progressTrack =
    document.getElementById("progress-track");

  const progressBar =
    document.getElementById("progress-bar");

  const currentTime =
    document.getElementById("current-time");

  const duration =
    document.getElementById("duration");

  const playlist =
    document.getElementById("playlist");


  let songs = [];
  let currentSong = 0;


  function pathURL(path){

    return path
      .split("/")
      .map(function(part){
        return encodeURIComponent(part);
      })
      .join("/");

  }


  function formatTime(seconds){

    if(!isFinite(seconds)){
      return "0:00";
    }

    const minutes =
      Math.floor(seconds / 60);

    const secs =
      Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");

    return minutes + ":" + secs;

  }


  function loadSong(index){

    if(!songs.length){
      return;
    }

    if(index < 0){
      index = songs.length - 1;
    }

    if(index >= songs.length){
      index = 0;
    }

    currentSong = index;

    const song =
      songs[currentSong];

    const audioURL =
      BASE + pathURL(song.audio);

    const coverURL =
      BASE + pathURL(song.portada);

    title.textContent =
      song.titulo;

    artist.textContent =
      song.artista;

    cover.src =
      coverURL;

    background.style.backgroundImage =
      'url("' + coverURL + '")';

    audio.src =
      audioURL;

    audio.load();

    progressBar.style.width =
      "0%";

    currentTime.textContent =
      "0:00";

    duration.textContent =
      "0:00";

    play.classList.remove(
      "playing"
    );

    updatePlaylist();

  }


  function startPlaying(){

    audio.play()
      .catch(function(error){
        console.log(error);
      });

  }


  function nextSong(){

    loadSong(currentSong + 1);
    startPlaying();

  }


  function previousSong(){

    loadSong(currentSong - 1);
    startPlaying();

  }


  play.addEventListener(
    "click",
    function(){

      if(audio.paused){
        startPlaying();
      }else{
        audio.pause();
      }

    }
  );


  previous.addEventListener(
    "click",
    previousSong
  );


  next.addEventListener(
    "click",
    nextSong
  );


  menu.addEventListener(
    "click",
    function(){

      playlist.classList.toggle(
        "open"
      );

    }
  );


  audio.addEventListener(
    "play",
    function(){

      play.classList.add(
        "playing"
      );

    }
  );


  audio.addEventListener(
    "pause",
    function(){

      play.classList.remove(
        "playing"
      );

    }
  );


  audio.addEventListener(
    "ended",
    nextSong
  );


  audio.addEventListener(
    "loadedmetadata",
    function(){

      duration.textContent =
        formatTime(audio.duration);

    }
  );


  audio.addEventListener(
    "timeupdate",
    function(){

      if(!audio.duration){
        return;
      }

      const percentage =
        (
          audio.currentTime /
          audio.duration
        ) * 100;

      progressBar.style.width =
        percentage + "%";

      currentTime.textContent =
        formatTime(
          audio.currentTime
        );

      duration.textContent =
        formatTime(
          audio.duration
        );

    }
  );


  progressTrack.addEventListener(
    "click",
    function(event){

      if(!audio.duration){
        return;
      }

      const rect =
        progressTrack
          .getBoundingClientRect();

      const position =
        event.clientX - rect.left;

      let percentage =
        position / rect.width;

      percentage =
        Math.max(
          0,
          Math.min(1,percentage)
        );

      audio.currentTime =
        percentage * audio.duration;

    }
  );


  function createPlaylist(){

    playlist.innerHTML =
      "";

    songs.forEach(
      function(song,index){

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "song";

        item.textContent =
          "♡ " +
          song.titulo +
          " — " +
          song.artista;

        item.addEventListener(
          "click",
          function(){

            loadSong(index);
            startPlaying();

            playlist.classList.remove(
              "open"
            );

          }
        );

        playlist.appendChild(
          item
        );

      }
    );

  }


  function updatePlaylist(){

    const items =
      playlist.querySelectorAll(
        ".song"
      );

    items.forEach(
      function(item,index){

        item.classList.toggle(
          "current",
          index === currentSong
        );

      }
    );

  }


  fetch(PLAYLIST_URL)

    .then(function(response){

      if(!response.ok){

        throw new Error(
          "No se pudo cargar playlist.json"
        );

      }

      return response.json();

    })

    .then(function(data){

      songs = data;

      createPlaylist();
      loadSong(0);

    })

    .catch(function(error){

      title.textContent =
        "playlist error";

      artist.textContent =
        "revisa GitHub";

      console.error(error);

    });

})();
</script>

</body>
</html>
