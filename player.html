<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ═══════════════════════════════
   RESET — aquí Blogger NO MANDA ♡
═══════════════════════════════ */

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  background:transparent;
  overflow:hidden;
}

body{
  font-family:Arial,sans-serif;
}


/* ═══════════════════════════════
             IPOD
═══════════════════════════════ */

#ipod{
  width:245px;
  margin:0 auto;

  padding:13px 12px 17px;

  border:1px solid #c8c8c8;
  border-radius:27px;

  background:
    linear-gradient(
      145deg,
      #fafafa 0%,
      #dedede 35%,
      #f6f6f6 65%,
      #d2d2d2 100%
    );

  box-shadow:
    inset 0 1px 3px rgba(255,255,255,.95),
    inset 0 -2px 5px rgba(100,100,100,.12),
    0 5px 12px rgba(0,0,0,.14);
}


/* ═══════════════════════════════
            PANTALLA
═══════════════════════════════ */

#screen{
  position:relative;

  width:100%;
  height:108px;

  overflow:hidden;

  border:5px solid #171717;
  border-radius:9px;

  background:#9f9698;

  box-shadow:
    inset 0 0 5px rgba(0,0,0,.35);
}


/* fondo de portada */

#screen-bg{
  position:absolute;

  inset:-15px;

  background-position:center;
  background-size:cover;

  filter:blur(14px);

  transform:scale(1.2);

  opacity:.55;
}


#screen-overlay{
  position:absolute;
  inset:0;

  background:
    rgba(35,28,31,.28);
}


/* portada y texto */

#screen-main{
  position:relative;

  z-index:2;

  display:flex;

  gap:10px;

  height:100%;

  padding:9px;
}


#cover{
  width:64px;
  height:64px;

  flex:0 0 64px;

  object-fit:cover;

  border-radius:5px;

  box-shadow:
    0 2px 6px rgba(0,0,0,.32);
}


#info{
  min-width:0;

  flex:1;

  padding-top:9px;

  color:#fff;

  text-shadow:
    0 1px 2px rgba(0,0,0,.35);
}


#title{
  overflow:hidden;

  font-size:12px;
  font-weight:bold;

  white-space:nowrap;
  text-overflow:ellipsis;
}


#artist{
  margin-top:7px;

  overflow:hidden;

  font-size:10px;

  white-space:nowrap;
  text-overflow:ellipsis;
}


/* ═══════════════════════════════
             PROGRESO
═══════════════════════════════ */

#progress-row{
  position:absolute;

  z-index:5;

  left:9px;
  right:9px;
  bottom:7px;

  display:flex;
  align-items:center;

  gap:5px;

  color:white;

  font-family:"Courier New",monospace;

  font-size:8px;
}


#progress-track{
  flex:1;

  height:7px;

  overflow:hidden;

  border-radius:20px;

  background:
    rgba(30,25,27,.35);

  cursor:pointer;
}


#progress-bar{
  width:0%;
  height:100%;

  border-radius:20px;

  background:
    rgba(255,255,255,.92);
}


/* ═══════════════════════════════
              RUEDA
═══════════════════════════════ */

#wheel{
  position:relative;

  width:137px;
  height:137px;

  margin:15px auto 0;

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #ffffff,
      #eeeeee
    );

  border:1px solid #c9c9c9;

  box-shadow:
    inset 0 1px 4px rgba(255,255,255,1),
    0 2px 4px rgba(0,0,0,.10);

  user-select:none;
}


/* círculo central */

#center{
  position:absolute;

  left:50%;
  top:50%;

  width:55px;
  height:55px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    linear-gradient(
      145deg,
      #e9e9e9,
      #d9d9d9
    );

  border:1px solid #c9c9c9;

  box-shadow:
    inset 0 1px 2px rgba(255,255,255,.9);
}


/* controles */

.control{
  position:absolute;

  z-index:10;

  color:#9fa2a6;

  font-family:Arial,sans-serif;

  font-weight:bold;

  line-height:1;

  cursor:pointer;

  text-align:center;

  user-select:none;
}


/* MUSIC */

#menu{
  top:13px;

  left:50%;

  transform:
    translateX(-50%);

  font-size:11px;

  letter-spacing:.5px;
}


/* izquierda */

#previous{
  left:14px;

  top:50%;

  transform:
    translateY(-50%);

  font-size:17px;
}


/* derecha */

#next{
  right:14px;

  top:50%;

  transform:
    translateY(-50%);

  font-size:17px;
}


/* play/pause */

#play{
  left:50%;

  bottom:12px;

  transform:
    translateX(-50%);

  width:35px;

  font-size:15px;
}


/* ═══════════════════════════════
             PLAYLIST
═══════════════════════════════ */

#playlist{
  display:none;

  width:245px;

  max-height:95px;

  margin:7px auto 0;

  padding:5px;

  overflow-y:auto;

  background:#fff8fb;

  border:1px solid #eccfd9;

  border-radius:10px;

  font-family:
    "Courier New",
    monospace;
}


#playlist.open{
  display:block;
}


.song{
  padding:6px 7px;

  border-radius:6px;

  color:#8d737d;

  font-size:9px;

  cursor:pointer;
}


.song:hover,
.song.current{
  background:#ffe5ef;

  color:#bd7892;
}

</style>
</head>


<body>


<div id="ipod">


  <!-- PANTALLA -->

  <div id="screen">

    <div id="screen-bg"></div>

    <div id="screen-overlay"></div>


    <div id="screen-main">

      <img id="cover" alt="portada">


      <div id="info">

        <div id="title">
          cargando...
        </div>

        <div id="artist">
          ♡
        </div>

      </div>

    </div>


    <div id="progress-row">

      <span id="current-time">
        0:00
      </span>


      <div id="progress-track">

        <div id="progress-bar"></div>

      </div>


      <span id="duration">
        0:00
      </span>

    </div>

  </div>



  <!-- RUEDA -->

  <div id="wheel">


    <div
      id="menu"
      class="control">
      MUSIC
    </div>


    <div
      id="previous"
      class="control">
      ◀
    </div>


    <div id="center"></div>


    <div
      id="next"
      class="control">
      ▶
    </div>


    <div
      id="play"
      class="control">
      ▶Ⅱ
    </div>


  </div>

</div>



<div id="playlist"></div>


<audio
  id="audio"
  preload="metadata">
</audio>



<script>

(function(){


/* ═══════════════════════════════
        ARCHIVOS DE GITHUB
═══════════════════════════════ */

const BASE =
  "https://camiandreafuentealba-dev.github.io/lazy-days-music/";

const PLAYLIST_URL =
  BASE + "playlist.json";



/* ELEMENTOS */

const audio =
  document.getElementById("audio");

const cover =
  document.getElementById("cover");

const background =
  document.getElementById("screen-bg");

const title =
  document.getElementById("title");

const artist =
  document.getElementById("artist");

const play =
  document.getElementById("play");

const previous =
  document.getElementById("previous");

const next =
  document.getElementById("next");

const menu =
  document.getElementById("menu");

const progressTrack =
  document.getElementById("progress-track");

const progressBar =
  document.getElementById("progress-bar");

const currentTime =
  document.getElementById("current-time");

const duration =
  document.getElementById("duration");

const playlist =
  document.getElementById("playlist");



let songs = [];

let currentSong = 0;



/* arreglar espacios de nombres */

function pathURL(path){

  return path
    .split("/")
    .map(function(part){

      return encodeURIComponent(part);

    })
    .join("/");

}



/* tiempo */

function formatTime(seconds){

  if(!isFinite(seconds)){

    return "0:00";

  }


  const minutes =
    Math.floor(seconds / 60);


  const secs =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2,"0");


  return minutes + ":" + secs;

}



/* cargar canción */

function loadSong(index){


  if(!songs.length){

    return;

  }


  if(index < 0){

    index =
      songs.length - 1;

  }


  if(index >= songs.length){

    index = 0;

  }


  currentSong = index;


  const song =
    songs[currentSong];


  const audioURL =
    BASE +
    pathURL(song.audio);


  const coverURL =
    BASE +
    pathURL(song.portada);


  title.textContent =
    song.titulo;


  artist.textContent =
    song.artista;


  cover.src =
    coverURL;


  background.style.backgroundImage =
    'url("' +
    coverURL +
    '")';


  audio.src =
    audioURL;


  progressBar.style.width =
    "0%";


  currentTime.textContent =
    "0:00";


  duration.textContent =
    "0:00";


  updatePlaylist();

}



/* reproducir */

function startPlaying(){


  audio.play()

    .then(function(){

      play.textContent =
        "Ⅱ";

    })

    .catch(function(error){

      console.log(error);

    });

}



/* siguiente */

function nextSong(){

  loadSong(
    currentSong + 1
  );

  startPlaying();

}



/* anterior */

function previousSong(){

  loadSong(
    currentSong - 1
  );

  startPlaying();

}



/* CONTROLES */

play.addEventListener(
  "click",
  function(){


    if(audio.paused){

      startPlaying();

    }

    else{

      audio.pause();

    }

  }
);



previous.addEventListener(
  "click",
  previousSong
);



next.addEventListener(
  "click",
  nextSong
);



menu.addEventListener(
  "click",
  function(){

    playlist.classList.toggle(
      "open"
    );

  }
);



/* estados play */

audio.addEventListener(
  "play",
  function(){

    play.textContent =
      "Ⅱ";

  }
);



audio.addEventListener(
  "pause",
  function(){

    play.textContent =
      "▶Ⅱ";

  }
);



/* pasar canción automáticamente */

audio.addEventListener(
  "ended",
  nextSong
);



/* duración */

audio.addEventListener(
  "loadedmetadata",
  function(){

    duration.textContent =
      formatTime(
        audio.duration
      );

  }
);



/* barra */

audio.addEventListener(
  "timeupdate",
  function(){


    if(!audio.duration){

      return;

    }


    const percentage =
      (
        audio.currentTime /
        audio.duration
      ) * 100;


    progressBar.style.width =
      percentage + "%";


    currentTime.textContent =
      formatTime(
        audio.currentTime
      );


    duration.textContent =
      formatTime(
        audio.duration
      );

  }
);



/* adelantar haciendo clic */

progressTrack.addEventListener(
  "click",
  function(event){


    if(!audio.duration){

      return;

    }


    const rect =
      progressTrack
        .getBoundingClientRect();


    const position =
      event.clientX -
      rect.left;


    audio.currentTime =
      (
        position /
        rect.width
      ) *
      audio.duration;

  }
);



/* crear playlist */

function createPlaylist(){


  playlist.innerHTML =
    "";


  songs.forEach(
    function(song,index){


      const item =
        document.createElement(
          "div"
        );


      item.className =
        "song";


      item.textContent =
        "♡ " +
        song.titulo +
        " — " +
        song.artista;


      item.addEventListener(
        "click",
        function(){


          loadSong(index);


          startPlaying();


          playlist
            .classList
            .remove("open");

        }
      );


      playlist.appendChild(
        item
      );

    }
  );

}



/* marcar canción */

function updatePlaylist(){


  const items =
    playlist.querySelectorAll(
      ".song"
    );


  items.forEach(
    function(item,index){


      item.classList.toggle(
        "current",
        index === currentSong
      );

    }
  );

}



/* ═══════════════════════════════
       CARGAR PLAYLIST.JSON
═══════════════════════════════ */

fetch(PLAYLIST_URL)

  .then(function(response){


    if(!response.ok){

      throw new Error(
        "No se pudo cargar playlist.json"
      );

    }


    return response.json();

  })


  .then(function(data){


    songs = data;


    createPlaylist();


    loadSong(0);

  })


  .catch(function(error){


    title.textContent =
      "playlist error";


    artist.textContent =
      "♡";


    console.error(error);

  });


})();

</script>

</body>
</html>
